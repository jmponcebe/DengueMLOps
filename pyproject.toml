[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tfm-mlops-dengue"
version = "0.1.0"
description = "MLOps pipeline for dengue prediction in Brazil"
authors = [
    {name = "Jose María Ponce Bernabé", email = "josemaria.ponce@alu.uclm.es"}
]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["mlops", "dengue", "prediction", "brazil", "epidemiology"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# Dependencies managed in requirements.txt and requirements-prod.txt
# to avoid version conflicts and allow flexible dep management

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "flake8>=6.1.0",
]

[project.urls]
"Homepage" = "https://github.com/jmponcebe/DengueMLOps"
"Bug Reports" = "https://github.com/jmponcebe/DengueMLOps/issues"
"Source" = "https://github.com/jmponcebe/DengueMLOps"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--cov=src --cov-report=html --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]
