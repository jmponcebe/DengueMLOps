# CI Pipeline — Tests, Lint + Docker Build
# Se ejecuta en cada push y PR

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short --cov=src --cov-report=term-missing

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 src/ app/ --max-line-length=120 --ignore=E501,W503

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f Dockerfile.api -t dengue-api:${{ github.sha }} .

      - name: Build Dashboard image
        run: docker build -f Dockerfile.dashboard -t dengue-dashboard:${{ github.sha }} .

      - name: Test API container starts
        run: |
          docker run -d --name test-api -p 8000:8000 dengue-api:${{ github.sha }}
          # Wait for container to be ready
          for i in $(seq 1 30); do
            if curl -s http://localhost:8000/health > /dev/null 2>&1; then
              echo "API ready after ${i}s"
              break
            fi
            sleep 1
          done
          # Verify health endpoint responds (model may be absent in CI)
          curl -f http://localhost:8000/health | python3 -m json.tool
          docker stop test-api
